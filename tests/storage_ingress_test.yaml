suite: storage and ingress

templates:
  - templates/pvc.yaml
  - templates/ingress.yaml

values:
  - values/base.yaml

tests:
  - it: keeps the PVC with the downloads on helm uninstall
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: lets the PVC go with the release when asked
    template: templates/pvc.yaml
    set:
      persistence.keepOnUninstall: false
    asserts:
      - isNull:
          path: metadata.annotations

  - it: defaults an ingress path's pathType to Prefix
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts: [{ host: tx.example.com, paths: [{ path: / }] }]
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
