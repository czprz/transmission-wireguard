suite: service

templates:
  - templates/service.yaml

values:
  - values/base.yaml

tests:
  - it: only exposes the web UI by default
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports
          value:
            - name: web
              port: 9091
              protocol: TCP
              targetPort: 9091

  - it: exposes peer ports only when asked
    set:
      service.exposePeerPorts: true
    asserts:
      - contains:
          path: spec.ports
          content:
            name: peer-tcp
            port: 51413
            protocol: TCP
            targetPort: 51413
      - contains:
          path: spec.ports
          content:
            name: peer-udp
            port: 51413
            protocol: UDP
            targetPort: 51413
