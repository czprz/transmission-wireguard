suite: service

templates:
  - templates/service.yaml

values:
  - values/base.yaml

tests:
  - it: only exposes the web UI by default
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports
          value:
            - name: web
              port: 9091
              protocol: TCP
              targetPort: 9091
