suite: validation

templates:
  - templates/deployment.yaml
  - templates/configmap-scripts.yaml
  - templates/configmap-settings.yaml
  - templates/secret-wg.yaml
  - templates/secret-rpc.yaml

values:
  - values/base.yaml

tests:
  - template: templates/deployment.yaml
    it: renders with a safe config
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: requires a WireGuard config
    set:
      wireguard.wg0Conf: ""
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf or wireguard.existingSecret must be set"

  - template: templates/deployment.yaml
    it: rejects firewall hooks in wg0.conf
    set:
      wireguard.wg0Conf: |
        [Interface]
        Address = 10.64.0.2/32
        PostUp = iptables -w -P OUTPUT DROP
        PreDown = iptables -w -P OUTPUT ACCEPT; iptables -w -F OUTPUT
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf has PreUp/PostUp/PreDown/PostDown hooks. They run as root and can open the kill switch, so remove them or set firewall.allowConfHooks"

  - template: templates/deployment.yaml
    it: allows hooks only when opted in
    set:
      firewall.allowConfHooks: true
      wireguard.wg0Conf: |
        [Interface]
        PostUp = iptables -w -A OUTPUT -o %i -j ACCEPT
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10:51820
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: rejects a split tunnel
    set:
      wireguard.wg0Conf: |
        [Interface]
        [Peer]
        AllowedIPs = 10.0.0.0/8
        Endpoint = 203.0.113.10:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf AllowedIPs must include 0.0.0.0/0 (full tunnel)"

  - template: templates/deployment.yaml
    it: rejects a hostname endpoint
    set:
      wireguard.wg0Conf: |
        [Interface]
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = vpn.example.com:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf Endpoint vpn.example.com must be an IP address because DNS is blocked until the tunnel is up"

  - template: templates/deployment.yaml
    it: needs the endpoint for the NetworkPolicy with an existing Secret
    set:
      wireguard.wg0Conf: ""
      wireguard.existingSecret: wg-client
    asserts:
      - failedTemplate:
          errorMessage: "networkPolicy.enabled needs the VPN endpoint. Set wireguard.endpoints (ip and port of your Endpoint), or disable networkPolicy if your CNI does not enforce it"

  - template: templates/deployment.yaml
    it: accepts an existing Secret with endpoints listed
    set:
      wireguard.wg0Conf: ""
      wireguard.existingSecret: wg-client
      wireguard.endpoints: [{ ip: 203.0.113.10, port: 51820 }]
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: refuses an exposed web UI without RPC auth
    set:
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "The web UI is exposed (ingress or non-ClusterIP Service) without RPC auth. Set transmission.rpcAuth.existingSecret (or username/password), or rpcAuth.allowAnonymous=true. Credentials in transmission.settings also work but belong in rpcAuth"

  - template: templates/deployment.yaml
    it: refuses a LoadBalancer web UI without RPC auth
    set:
      service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: "The web UI is exposed (ingress or non-ClusterIP Service) without RPC auth. Set transmission.rpcAuth.existingSecret (or username/password), or rpcAuth.allowAnonymous=true. Credentials in transmission.settings also work but belong in rpcAuth"

  - template: templates/deployment.yaml
    it: allows an exposed web UI with RPC auth
    set:
      ingress.enabled: true
      transmission.rpcAuth.existingSecret: tx-rpc
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: allows an exposed anonymous web UI when explicitly accepted
    set:
      ingress.enabled: true
      transmission.rpcAuth.allowAnonymous: true
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: accepts RPC auth set the pre-1.0 way in settings
    set:
      ingress.enabled: true
      transmission.settings.rpc-authentication-required: true
      transmission.settings.rpc-username: admin
      transmission.settings.rpc-password: s3cret
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: refuses half-set inline RPC credentials
    set:
      transmission.rpcAuth.username: admin
    asserts:
      - failedTemplate:
          errorMessage: "transmission.rpcAuth needs both username and password (or existingSecret)"

  - template: templates/deployment.yaml
    it: refuses an Endpoint without a port
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf Endpoint 203.0.113.10 needs a port (ip and port, e.g. 203.0.113.10 then 51820)"

  - template: templates/deployment.yaml
    it: refuses an out-of-range Endpoint port
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10:99999
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf Endpoint port 99999 must be between 1 and 65535"

  - template: templates/deployment.yaml
    it: refuses an Endpoint that is not a valid IP
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 999.1.1.1:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf Endpoint 999.1.1.1 must be an IP address because DNS is blocked until the tunnel is up"

  - template: templates/deployment.yaml
    it: refuses AllowedIPs that only look like a full tunnel
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        [Peer]
        AllowedIPs = 10.0.0.0/0, 10.0.0.0/8 # todo 0.0.0.0/0
        Endpoint = 203.0.113.10:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf AllowedIPs must include 0.0.0.0/0 (full tunnel)"

  - template: templates/deployment.yaml
    it: accepts a full tunnel with CRLF line endings and several AllowedIPs lines
    set:
      wireguard.wg0Conf: "[Interface]\r\nPrivateKey = x\r\n[Peer]\r\nAllowedIPs = ::/0\r\nAllowedIPs = 0.0.0.0/0\r\nEndpoint = 203.0.113.10:51820\r\n"
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: refuses Table in wg0.conf
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        Table = 1234
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf sets Table, which turns off the fwmark routing the kill switch relies on. Remove it."

  - template: templates/deployment.yaml
    it: rejects hooks that hide firewall commands in a script
    set:
      wireguard.wg0Conf: |
        [Interface]
        PrivateKey = x
        postup=/config/up.sh
        [Peer]
        AllowedIPs = 0.0.0.0/0
        Endpoint = 203.0.113.10:51820
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.wg0Conf has PreUp/PostUp/PreDown/PostDown hooks. They run as root and can open the kill switch, so remove them or set firewall.allowConfHooks"

  - template: templates/deployment.yaml
    it: ignores the pre-1.0 hooks key when it is false
    set:
      firewall.allowConfFirewallHooks: false
    asserts:
      - isKind:
          of: Deployment

  - template: templates/deployment.yaml
    it: refuses the pre-1.0 hooks key
    set:
      firewall.allowConfFirewallHooks: true
    asserts:
      - failedTemplate:
          errorMessage: "firewall.allowConfFirewallHooks was renamed to firewall.allowConfHooks and now covers every PreUp/PostUp/PreDown/PostDown hook"

  - template: templates/deployment.yaml
    it: refuses an rpc-port different from the web port
    set:
      transmission.settings.rpc-port: 8080
    asserts:
      - failedTemplate:
          errorMessage: "transmission.settings rpc-port (8080) must equal service.webPort (9091), the only port the kill switch opens to the cluster"

  - template: templates/deployment.yaml
    it: refuses random peer ports
    set:
      transmission.settings.peer-port-random-on-start: true
    asserts:
      - failedTemplate:
          errorMessage: "transmission.settings peer-port-random-on-start must be false. The kill switch only accepts peers on the fixed peer-port"

  - template: templates/deployment.yaml
    it: refuses the removed exposePeerPorts
    set:
      service.exposePeerPorts: true
    asserts:
      - failedTemplate:
          errorMessage: "service.exposePeerPorts was removed. Peers can only reach Transmission through the VPN, never through the Service"

  - template: templates/deployment.yaml
    it: refuses capabilities that would let Transmission bypass the kill switch
    set:
      transmission.securityContext.capabilities.add: [NET_ADMIN]
    asserts:
      - failedTemplate:
          errorMessage: "transmission.securityContext must not be privileged or add NET_ADMIN, NET_RAW, SYS_ADMIN or ALL. These would let Transmission bypass the kill switch"

  - template: templates/deployment.yaml
    it: refuses a privileged Transmission container
    set:
      transmission.securityContext.privileged: true
    asserts:
      - failedTemplate:
          errorMessage: "transmission.securityContext must not be privileged or add NET_ADMIN, NET_RAW, SYS_ADMIN or ALL. These would let Transmission bypass the kill switch"

  - template: templates/deployment.yaml
    it: refuses a DNS override without nameservers
    set:
      wireguard.dns.nameservers: []
      wireguard.existingSecret: wg
      networkPolicy.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "wireguard.dns.override needs at least one entry in wireguard.dns.nameservers"
