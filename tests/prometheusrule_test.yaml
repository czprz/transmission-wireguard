suite: prometheusrule

templates:
  - templates/prometheusrule.yaml

values:
  - values/base.yaml

release:
  name: twg
  namespace: media

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: needs the Prometheus Operator's CRD
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "monitoring.prometheusRule.enabled needs the Prometheus Operator's PrometheusRule CRD (monitoring.coreos.com/v1) in the cluster"

  - it: alerts on the tunnel, availability, restarts and full volumes of this release only
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PrometheusRule
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.labels:
        release: kube-prometheus-stack
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TransmissionWireguardTunnelDown
      - equal:
          path: spec.groups[0].rules[1].alert
          value: TransmissionWireguardUnavailable
      - equal:
          path: spec.groups[0].rules[2].alert
          value: TransmissionWireguardRestarting
      - equal:
          path: spec.groups[0].rules[3].alert
          value: TransmissionWireguardVolumeFilling
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max by (namespace, pod) (kube_pod_init_container_status_ready{namespace="media", container="wireguard"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_owner{namespace="media", owner_kind="ReplicaSet", owner_name=~"twg-transmission-wireguard-[a-z0-9]+"})) == 0
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[0].rules[1].expr
          value: kube_deployment_status_replicas_available{namespace="media", deployment="twg-transmission-wireguard"} < 1
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: 'persistentvolumeclaim=~"\^\(twg-transmission-wireguard\)\$"'
      - equal:
          path: spec.groups[0].rules[0].annotations.summary
          value: "The WireGuard tunnel of {{ $labels.pod }} has been down for 5m"

  - it: takes thresholds and extra rules
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PrometheusRule
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.severity: critical
      monitoring.prometheusRule.tunnelDownFor: 15m
      monitoring.prometheusRule.restartsPer30m: 5
      monitoring.prometheusRule.volumeFreeRatio: 0.05
      monitoring.prometheusRule.extraRules:
        - alert: Custom
          expr: vector(1)
    asserts:
      - equal:
          path: spec.groups[0].rules[0].for
          value: 15m
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: critical
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: '\) > 5\n?$'
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: '< 0.05\n?$'
      - equal:
          path: spec.groups[0].rules[4]
          value:
            alert: Custom
            expr: vector(1)

  - it: watches the claims actually mounted, existing ones too
    template: templates/prometheusrule.yaml
    capabilities:
      apiVersions: [monitoring.coreos.com/v1/PrometheusRule]
    set:
      monitoring.prometheusRule.enabled: true
      persistence.existingClaim: media-config
      persistence.downloads.enabled: true
      persistence.downloads.existingClaim: media
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: 'persistentvolumeclaim=~"\^\(media-config\|media\)\$"'

  - it: finds the pods through their ReplicaSet, so long release names still match
    template: templates/prometheusrule.yaml
    release:
      name: a-very-long-release-name-for-transmission
    capabilities:
      apiVersions: [monitoring.coreos.com/v1/PrometheusRule]
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'owner_kind="ReplicaSet", owner_name=~"a-very-long-release-name-for-transmission-transmission-wireguar-\[a-z0-9\]\+"'
      - notMatchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'pod=~'

  - it: leaves the volume alert out without a PVC
    template: templates/prometheusrule.yaml
    capabilities:
      apiVersions: [monitoring.coreos.com/v1/PrometheusRule]
    set:
      monitoring.prometheusRule.enabled: true
      persistence.enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
