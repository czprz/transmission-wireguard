name: Kill switch mutation test

# Proves the leak tests guard every firewall rule: each mutant turns one rule
# off and runs the Docker leak test, which must then fail. Rules listed in
# tests/e2e/mutation-baseline.txt may survive. Weekly and by hand it runs
# every mutant. On a pull request it runs every mutant when the leak test or
# the sidecar image changed, the mutants on changed lines of
# files/firewall.sh when only that did, and none otherwise; mutation-passed
# reports on every pull request, so it can be a required check.

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      batches: ${{ steps.list.outputs.batches }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      # At most 6 batches, all running at once: each job sets up the Docker
      # test once per mutant, and the run takes as long as its slowest
      # batch. Mutants are dealt out round-robin, the baseline's first (they
      # survive, so each runs the whole suite, ~9 minutes, against ~2 for
      # one a check kills), so no batch collects the slow ones. Neighbouring
      # rules, which tend to be caught by the same late check, end up in
      # different batches too.
      - name: List mutants
        id: list
        run: |
          # Every mutant when the leak test or the sidecar image changed (a new
          # iptables can change what a rule does); those on changed lines when
          # only firewall.sh did; none otherwise, and mutation-passed passes.
          mode=all
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            mode=none
            while read -r f; do
              case $f in
                tests/e2e/docker/* | tests/e2e/docker-test.sh | tests/e2e/mutation-test.sh | tests/e2e/mutation-baseline.txt | \
                  tests/e2e/package.json | tests/e2e/package-lock.json | image/wireguard/* | .github/workflows/kill-switch-mutation.yml)
                  mode=all ;;
                files/firewall.sh) [ "$mode" = all ] || mode=changed ;;
              esac
            done <<<"$changed"
          fi
          echo "Mutants to run: $mode"
          case $mode in
            all) lines=$(tests/e2e/mutation-test.sh --list --slow-first) ;;
            changed) lines=$(tests/e2e/mutation-test.sh --list --changed "$BASE_SHA" --slow-first) ;;
            none) lines="" ;;
          esac
          echo "Mutants: ${lines//$'\n'/ }"
          # Assigned first, so a jq error fails the step.
          batches=$(jq -cRs 'split("\n") | map(select(length > 0)) | length as $l | ([$l, 6] | min) as $n |
            [range(0; $n) as $i | [range($i; $l; $n) as $j | .[$j]] | join(" ")]' <<<"$lines")
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  mutant:
    name: mutants ${{ matrix.lines }}
    needs: mutants
    if: needs.mutants.outputs.batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lines: ${{ fromJSON(needs.mutants.outputs.batches) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      # The chart's own sidecar image: with natpmpc, so the port-forwarding
      # rules have checks that can kill their mutants. Built before
      # AppArmor is unloaded: runc cannot start the build's containers after.
      - name: Build the sidecar image
        run: docker build -t twg-wireguard:ci image/wireguard

      # As in helm-chart.yaml: the runner's AppArmor profiles break wg-quick.
      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Install bats
        run: npm ci --prefix tests/e2e --no-audit --no-fund

      - name: Leak test without each of firewall.sh lines ${{ matrix.lines }}
        run: |
          set -o pipefail
          tests/e2e/mutation-test.sh ${{ matrix.lines }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SIDECAR_IMAGE: twg-wireguard:ci

  # One result to look at (and to require, if you want it on the PRs above).
  mutation-passed:
    if: always()
    needs: [mutants, mutant]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every mutant was killed or is in the baseline
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS" >/dev/null || { echo "$NEEDS"; exit 1; }
        env:
          NEEDS: ${{ toJSON(needs) }}

  # A failed weekly run opens an issue, or adds to the open one, instead of
  # only an email.
  report:
    if: failure() && github.event_name == 'schedule'
    needs: [mutation-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        run: |
          title="Weekly run failed: ${WORKFLOW}"
          run_url="${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          n=$(gh issue list -R "$REPO" --state open --search "in:title \"${title}\"" --json number,title -q ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "Failed again: ${run_url}"
          else
            gh issue create -R "$REPO" --title "$title" --body "The scheduled run failed: ${run_url}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
