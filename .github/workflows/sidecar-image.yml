name: Sidecar image

# The WireGuard sidecar image (image/wireguard). Every change runs the
# Docker leak test against it and scans it; main, the weekly run (Alpine's
# security fixes) and a manual run publish it to GHCR, signed, with a build
# provenance attestation.
on:
  pull_request:
    paths:
      - image/wireguard/**
      - files/firewall.sh
      - tests/e2e/docker/**
      - tests/e2e/docker-test.sh
      - .github/workflows/sidecar-image.yml
  push:
    branches:
      - main
    paths:
      - image/wireguard/**
      - .github/workflows/sidecar-image.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidecar-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twg-wireguard
  # Pinned: the scanner runs with the image and the workflow's token around.
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  test:
    name: leak test (${{ matrix.runner }}, ${{ matrix.sidecar }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            sidecar: privileged
          - runner: ubuntu-latest
            sidecar: unprivileged
          - runner: ubuntu-24.04-arm
            sidecar: privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build the image
        run: docker build -t twg-wireguard:ci image/wireguard

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      # As in helm-chart.yaml: the runner's AppArmor profiles break wg-quick.
      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Install bats
        run: npm ci --prefix tests/e2e --no-audit --no-fund

      - name: Leak test with the image as the sidecar
        run: tests/e2e/docker-test.sh
        env:
          SIDECAR: ${{ matrix.sidecar }}
          SIDECAR_IMAGE: twg-wireguard:ci

      # Fixable HIGH and CRITICAL vulnerabilities fail the run; a weekly
      # rebuild picks up Alpine's fixes.
      - name: Scan the image
        if: matrix.sidecar == 'privileged'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY}" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress twg-wireguard:ci

  # The image in a cluster, through the chart: kindnet (dual-stack) and
  # Calico (NetworkPolicy), as in helm-chart.yaml's e2e-kind.
  cluster:
    name: cluster (${{ matrix.cni }}, k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cni: kindnet
            ipv6: 1
            k8s: "1.37"
            kind: v0.33.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            kubectl: v1.37.0
            kubectl_sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
            helm: v4.3.1
          - cni: calico
            ipv6: 0
            k8s: "1.32"
            kind: v0.27.0
            node: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
            kubectl: v1.32.2
            kubectl_sha256: 4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea
            helm: v3.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build the image
        run: docker build -t twg-wireguard:ci image/wireguard

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: ${{ matrix.helm }}

      - name: Install kubectl
        run: |
          curl -sSLo kubectl "https://dl.k8s.io/release/${{ matrix.kubectl }}/bin/linux/amd64/kubectl"
          echo "${{ matrix.kubectl_sha256 }}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      - name: Create kind cluster and load the image
        run: |
          go install "sigs.k8s.io/kind@${{ matrix.kind }}"
          kind="$(go env GOPATH)/bin/kind"
          KIND="$kind" NODE_IMAGE="${{ matrix.node }}" tests/e2e/kind-cluster.sh ${{ matrix.cni }}
          "$kind" load docker-image twg-wireguard:ci

      - name: Install bats
        run: npm ci --prefix tests/e2e --no-audit --no-fund

      - name: Cluster leak test with the image as the sidecar
        run: tests/e2e/cluster-test.sh
        env:
          IPV6: ${{ matrix.ipv6 }}
          SIDECAR_IMAGE: twg-wireguard:ci

  publish:
    needs: [test, cluster]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the wireguard-tools version and the build date, plus the
      # commit. The chart pins the digest, never a tag.
      - name: Tags
        id: tags
        run: |
          version=$(docker run --rm --entrypoint wg "$(docker build -q image/wireguard)" --version | awk '{ print $2 }')
          echo "tags=${IMAGE,,}:${version#v}-$(date -u +%Y%m%d),${IMAGE,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: image/wireguard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/twg-wireguard
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "Published \`${IMAGE,,}@${DIGEST}\`"
            echo
            echo "Tags: ${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
