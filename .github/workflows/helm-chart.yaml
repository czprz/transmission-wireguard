name: Helm Chart

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint . --strict -f ci/default-values.yaml

      - name: Chart-testing lint
        run: ct lint --charts . --validate-maintainers=false

      - name: Render chart
        run: helm template transmission-wireguard . -f ci/default-values.yaml > /tmp/manifest.yaml

      - name: Kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/manifest.yaml

      - name: Helm unittest
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/apps" \
            helmunittest/helm-unittest:3.11.1-0.3.0 .


  # Leak tests: try to make traffic escape the tunnel and fail if it does.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      # The runner's AppArmor profiles attach to binaries such as wg and
      # readlink by path, also inside privileged containers, and deny what
      # wg-quick needs ("Permission denied"). The tests need a plain host.
      - name: Unload host AppArmor profiles
        run: |
          sudo aa-status 2>/dev/null | grep -iE 'wg|wireguard|readlink|ip$' || true
          sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Kill switch leak test (Docker)
        run: tests/e2e/netns-leak-test.sh

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      # go install verifies kind against the Go checksum database; the node
      # image is the digest published in the kind v0.27.0 release notes.
      - name: Create kind cluster
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          "$(go env GOPATH)/bin/kind" create cluster --wait 120s \
            --image kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f

      - name: Kill switch leak test (kind)
        run: tests/e2e/kind-test.sh
