name: Helm Chart

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint . --strict -f ci/default-values.yaml

      - name: Chart-testing lint
        run: ct lint --all --chart-dirs .

      - name: Render chart
        run: helm template transmission-wireguard . -f ci/default-values.yaml > /tmp/manifest.yaml

      - name: Kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/manifest.yaml

      - name: Helm unittest
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/apps" \
            helmunittest/helm-unittest:3.11.1-0.3.0 .


  # Leak tests: try to make traffic escape the tunnel and fail if it does.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      - name: Kill switch leak test (Docker)
        run: tests/e2e/netns-leak-test.sh

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5
        with:
          version: v3.14.4

      - name: Create kind cluster
        run: |
          KIND_VERSION=0.27.0
          curl -sSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind create cluster --image kindest/node:v1.32.2 --wait 120s

      - name: Kill switch leak test (kind)
        run: tests/e2e/kind-test.sh
