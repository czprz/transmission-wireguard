name: Helm Chart

# main runs it through helm-main.yml, which releases only if it passes.
on:
  pull_request:
  push:
    branches:
      - dev
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Runs of other
# events (a push to dev, main's release gate) are never cancelled: main
# releases only if its run finishes.
concurrency:
  group: helm-chart-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint . --strict -f ci/default-values.yaml

      - name: Chart-testing lint
        run: ct lint --charts . --validate-maintainers=false

      - name: Render chart
        run: helm template transmission-wireguard . -f ci/default-values.yaml > /tmp/manifest.yaml

      - name: Kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/manifest.yaml

      - name: Helm unittest
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/apps" \
            helmunittest/helm-unittest:3.11.1-0.3.0@sha256:97f1d07dad520c9af52e090198469515b7b194622b5085302e40b11a8a930613 .

      - name: Schema test
        run: tests/schema-test.sh


  # Leak tests: try to make traffic escape the tunnel and fail if it does.
  # The Docker test runs on amd64 and arm64 (the images are multi-arch).
  e2e-docker:
    name: e2e-docker (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      # The runner's AppArmor profiles attach to binaries such as wg and
      # readlink by path, also inside privileged containers, and deny what
      # wg-quick needs ("Permission denied"). The tests need a plain host.
      - name: Unload host AppArmor profiles
        run: |
          sudo aa-status 2>/dev/null | grep -iE 'wg|wireguard|readlink|ip$' || true
          sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Kill switch leak test (Docker)
        run: tests/e2e/netns-leak-test.sh

  # The kind test runs once per NetworkPolicy implementation; kindnet runs
  # dual-stack and adds the IPv6 checks.
  e2e-kind:
    name: e2e-kind (${{ matrix.cni }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cni: kindnet
            ipv6: 1
          - cni: calico
            ipv6: 0
          - cni: cilium
            ipv6: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      # The cluster's version, not whatever the runner image ships.
      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.32.2
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      # go install verifies kind against the Go checksum database.
      - name: Create kind cluster (${{ matrix.cni }})
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          KIND="$(go env GOPATH)/bin/kind" tests/e2e/kind-cluster.sh ${{ matrix.cni }}

      - name: Kill switch leak test (kind, ${{ matrix.cni }})
        run: tests/e2e/kind-test.sh
        env:
          IPV6: ${{ matrix.ipv6 }}

  # The one check to require in branch protection: GitHub counts a skipped
  # job (e2e after a failed verify) as passed.
  all-tests:
    if: always()
    needs: [verify, e2e-docker, e2e-kind]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        run: jq -e 'to_entries | all(.value.result == "success")' <<<"$NEEDS" >/dev/null || { echo "$NEEDS"; exit 1; }
        env:
          NEEDS: ${{ toJSON(needs) }}
