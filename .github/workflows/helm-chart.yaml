name: Helm Chart

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Install chart-testing
        run: |
          CT_VERSION=3.11.0
          curl -sSL "https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}/chart-testing_${CT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp ct etc
          sudo mv /tmp/ct /usr/local/bin/ct
          sudo mkdir -p /etc/ct
          sudo mv /tmp/etc/* /etc/ct/
          pip install --quiet yamllint yamale

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint . --strict

      - name: Chart-testing lint
        run: ct lint --all --chart-dirs .

      - name: Render chart
        run: helm template transmission-wireguard . > /tmp/manifest.yaml

      - name: Kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/manifest.yaml

      - name: Helm unittest
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/apps" \
            helmunittest/helm-unittest:3.11.1-0.3.0 .

