name: Transmission image

# The minimal Transmission image (image/transmission), for
# images.transmission.flavor=minimal. Every change scans it and runs the
# cluster leak test with it as the Transmission container; main, the weekly
# run (Alpine's security fixes) and a manual run publish it to GHCR, signed,
# with a build provenance attestation.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - image/transmission/**
      - .github/workflows/transmission-image.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transmission-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twg-transmission
  # Pinned: the scanner runs with the image and the workflow's token around.
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  # Pull requests run the image's tests only when they touch what goes into
  # the image or tests it; transmission-image-passed reports either way, so it can be a
  # required check (a workflow with a path filter would leave it pending).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Relevant changes
        id: diff
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          run=false
          while read -r f; do
            case $f in image/transmission/*|files/*|templates/*|values.yaml|values.schema.json|tests/e2e/cluster/*|tests/e2e/cluster-test.sh|tests/e2e/kind-cluster.sh|.github/workflows/transmission-image.yml) run=true ;; esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "run=${run}" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # The image in a cluster, through the chart: kindnet (dual-stack) and
  # Calico (NetworkPolicy), as in helm-chart.yaml's e2e-kind. The suite
  # covers the web UI, helm test (capabilities), and a clean stop on SIGTERM.
  cluster:
    name: cluster (${{ matrix.cni }}, k8s ${{ matrix.k8s }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cni: kindnet
            ipv6: 1
            k8s: "1.37"
            kind: v0.33.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            kubectl: v1.37.0
            kubectl_sha256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
            helm: v4.3.1
          - cni: calico
            ipv6: 0
            k8s: "1.32"
            kind: v0.27.0
            node: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
            kubectl: v1.32.2
            kubectl_sha256: 4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea
            helm: v3.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build the image
        run: docker build -t twg-transmission:ci image/transmission

      # Fixable HIGH and CRITICAL vulnerabilities fail the run; a weekly
      # rebuild picks up Alpine's fixes.
      - name: Scan the image
        if: matrix.cni == 'kindnet'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY}" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress twg-transmission:ci

      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard

      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || sudo systemctl stop apparmor || true

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5
        with:
          version: ${{ matrix.helm }}

      - name: Install kubectl
        run: |
          curl -sSLo kubectl "https://dl.k8s.io/release/${{ matrix.kubectl }}/bin/linux/amd64/kubectl"
          echo "${{ matrix.kubectl_sha256 }}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

      - name: Create kind cluster and load the image
        run: |
          go install "sigs.k8s.io/kind@${{ matrix.kind }}"
          kind="$(go env GOPATH)/bin/kind"
          KIND="$kind" NODE_IMAGE="${{ matrix.node }}" tests/e2e/kind-cluster.sh ${{ matrix.cni }}
          "$kind" load docker-image twg-transmission:ci

      - name: Install bats
        run: npm ci --prefix tests/e2e --no-audit --no-fund

      - name: Cluster leak test with the image as Transmission
        run: tests/e2e/cluster-test.sh
        env:
          IPV6: ${{ matrix.ipv6 }}
          TRANSMISSION_IMAGE: twg-transmission:ci

  publish:
    needs: [cluster]
    # main only: a run from another branch must not publish a signed image
    # (Renovate would propose it for the chart).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        # Pinned: it runs in the job that signs and pushes the image.
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, pushed under the commit's tag. The version tag (the
      # Transmission version and the build date) is then read from that pushed
      # image and added to the same digest, so it always names what was
      # built. The chart pins the digest, never a tag.
      - name: Image name
        id: ref
        run: |
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: image/transmission
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.sha_tag }}
          provenance: false

      - name: Version tag
        id: tags
        run: |
          # From the daemon's own version line only ("transmission-daemon X.Y.Z
          # (...)", on stderr), so a warning printed by docker can't become the tag.
          version=$(docker run --rm "${REF}@${DIGEST}" --version 2>&1 | sed -nE 's/^transmission-daemon ([0-9]+\.[0-9]+\.[0-9]+)( .*)?$/\1/p' | head -n1)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "could not read a version from ${REF}@${DIGEST} (got '${version}')" >&2; exit 1; }
          # Date and time: a second build on the same day gets a tag of its
          # own instead of taking over the first one's.
          tag="${REF}:${version#v}-$(date -u +%Y%m%d%H%M)"
          # The weekly rebuild exists for Alpine's fixes: with the same
          # packages as the newest published version, it gets no version tag,
          # so Renovate proposes nothing. (Changes to the image's own files
          # come through a push to main, which is always tagged.)
          if [ "$EVENT" = schedule ]; then
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${REF#ghcr.io/}:pull" | jq -r .token)
            latest=$(curl -fsS -H "Authorization: Bearer ${token}" "https://${REF%%/*}/v2/${REF#ghcr.io/}/tags/list" |
              jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}([0-9]{4})?$' | sort -V | tail -n1 || true)
            pkgs() { docker run --rm --entrypoint cat "$1" /lib/apk/db/installed 2>/dev/null | grep -E '^[PV]:' || true; }
            if [ -n "$latest" ] && [ -n "$(pkgs "${REF}@${DIGEST}")" ] && [ "$(pkgs "${REF}@${DIGEST}")" = "$(pkgs "${REF}:${latest}")" ]; then
              echo "Same packages as ${latest}: no new version tag."
              echo "tags=${SHA_TAG} (packages as in ${latest})" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          docker buildx imagetools create --tag "$tag" "${REF}@${DIGEST}"
          echo "tags=${tag},${SHA_TAG}" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ steps.ref.outputs.image }}
          SHA_TAG: ${{ steps.ref.outputs.sha_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign the image
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/twg-transmission
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "Published \`${IMAGE,,}@${DIGEST}\`"
            echo
            echo "Tags: ${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}

  # The one check to require: the tests passed, or nothing they cover changed.
  transmission-image-passed:
    if: always()
    needs: [changes, cluster]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job passed or had nothing to test
        run: |
          jq -e '.changes.result == "success" and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' <<<"$NEEDS" >/dev/null ||
            { echo "$NEEDS"; exit 1; }
        env:
          NEEDS: ${{ toJSON(needs) }}
