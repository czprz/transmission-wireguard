name: Helm Main

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # The full PR pipeline, leak tests included: nothing is released unless
  # they pass on this commit. Not for release-please's own release commit:
  # its pull request already passed it, and helm-release.yml runs it again
  # before anything is published.
  verify:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    uses: ./.github/workflows/helm-chart.yaml
    permissions:
      contents: read

  # release-please keeps a "chore(main): release X.Y.Z" pull request up to
  # date: the next version (Conventional Commits) in Chart.yaml and
  # .release-please-manifest.json, and its CHANGELOG.md section. Merging
  # that pull request tags the commit and creates the GitHub release, and
  # this job then starts the publish. main is protected, so nothing is
  # pushed to it directly. GH_PAT, not the workflow's token: a pull request
  # opened with that would not run CI, so it could never merge.
  release-please:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    steps:
      - name: Release pull request, or the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # helm-release.yml runs the full suite on the tag, then pushes the
      # signed chart to GHCR.
      - name: Publish the chart
        if: steps.release.outputs.release_created == 'true'
        run: gh workflow run helm-release.yml --repo "${{ github.repository }}" --ref "${TAG}"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
