name: Helm Main

"on":
  push:
    branches:
      - main

permissions:
  contents: read

# One run at a time, never two racing in release-please. GitHub keeps one
# waiting run: a merge while one is waiting replaces it, and the newer run
# covers both commits (release-please tags a merged release PR either way).
concurrency:
  group: helm-main
  cancel-in-progress: false

jobs:
  # The full PR pipeline, leak tests included, on every commit to main,
  # release commits too: nothing is released unless it passed here.
  verify:
    uses: ./.github/workflows/helm-chart.yaml
    # Everything helm-chart.yaml's jobs ask for, and nothing more.
    permissions:
      contents: read
      packages: read

  # release-please keeps a "chore(main): release X.Y.Z" pull request up to
  # date: the next version (Conventional Commits) in Chart.yaml and
  # .release-please-manifest.json, and its CHANGELOG.md section. Merging
  # that pull request makes it tag the commit and create the GitHub release.
  # main is protected, so nothing is pushed to it directly. It runs with a
  # GitHub App's token: one from the workflow's own token would not start
  # CI on the release pull request, so it could never merge, and the App's
  # tokens are short-lived and never expire like a PAT.
  release-please:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release pull request, or the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The new release's chart, signed, pushed to GHCR and attached to it.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/helm-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
