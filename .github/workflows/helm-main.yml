name: Helm Main

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # The full PR pipeline, leak tests included: nothing is released unless
  # they pass on this commit.
  # Not for the release commit itself (pushed with GH_PAT, so the actor is
  # a person): it only bumps the version of a commit that already passed.
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/helm-chart.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # The changelog tools need Node 22 or newer.
          node-version: 24

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      # ci/release.sh pins its tools; helm-chart.yaml dry-runs it on every
      # pull request, so a broken tool fails there, not here.
      - name: Next version
        id: next
        run: |
          # Assigned first, so a failing tool fails the step.
          version=$(ci/release.sh next)
          echo "new_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version and CHANGELOG
        if: steps.next.outputs.new_version != ''
        run: |
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" Chart.yaml
          [ "$(helm show chart . | sed -n 's/^version: //p')" = "${NEW_VERSION}" ]
          ci/release.sh notes "${NEW_VERSION}" > RELEASE_BODY.md
          ci/release.sh changelog "${NEW_VERSION}"
        env:
          NEW_VERSION: ${{ steps.next.outputs.new_version }}

      - name: Commit and tag
        if: steps.next.outputs.new_version != ''
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.next.outputs.new_version }}"
          git tag "v${{ steps.next.outputs.new_version }}"
          git push
          git push --tags

      - name: Trigger Helm Release workflow
        if: steps.next.outputs.new_version != ''
        run: |
          gh workflow run helm-release.yml --ref "v${{ steps.next.outputs.new_version }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create GitHub release
        if: steps.next.outputs.new_version != ''
        run: |
          gh release create "v${{ steps.next.outputs.new_version }}" \
            --title "v${{ steps.next.outputs.new_version }}" \
            --notes-file RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Cleanup release notes
        if: always()
        run: rm -f RELEASE_BODY.md
