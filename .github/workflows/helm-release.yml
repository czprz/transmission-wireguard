name: Helm Release

# Started by helm-main.yml after a release commit; run by hand only to
# re-publish. Either way the full test suite runs first.
"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/helm-chart.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.14.4

      - name: Install yq
        run: |
          YQ_VERSION=4.45.1
          curl -sSLo yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049  yq" | sha256sum -c -
          sudo install -m 0755 yq /usr/local/bin/yq
          rm yq

      - name: Lint chart
        run: helm lint . --strict -f ci/default-values.yaml

      - name: Read chart version
        id: chart
        run: echo "result=$(yq -r '.version' Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches chart version
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "Run this on a release tag, not the ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION}" != "${{ steps.chart.outputs.result }}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match Chart.yaml version (${{ steps.chart.outputs.result }})."
            exit 1
          fi

      - name: Package chart
        run: |
          mkdir -p dist
          helm package . --destination dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push dist/*.tgz oci://ghcr.io/dever-labs
