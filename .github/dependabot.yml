version: 2
updates:
  # GitHub Actions updates — handled here since Renovate is scoped to Docker images only.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5

  # Docker image updates are handled by Renovate (renovate.json).
  # Renovate uses regexManagers to track image tags in templates/_helpers.tpl
  # and Chart.yaml, which Dependabot's docker ecosystem cannot do.
