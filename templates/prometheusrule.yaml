{{- with .Values.monitoring.prometheusRule -}}
{{- if .enabled -}}
{{- if not ($.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") -}}
{{- fail "monitoring.prometheusRule.enabled needs the Prometheus Operator's PrometheusRule CRD (monitoring.coreos.com/v1) in the cluster" -}}
{{- end -}}
{{- $name := include "twg.fullname" $ -}}
{{- $ns := $.Release.Namespace -}}
{{- /* The Deployment's pods, by their ReplicaSet (<name>-<hash>): a pod's
own name is cut short for long names, so a pattern on it can miss. */ -}}
{{- $owned := printf "* on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_owner{namespace=%q, owner_kind=\"ReplicaSet\", owner_name=~%q})" $ns (printf "%s-[a-z0-9]+" (regexQuoteMeta $name)) -}}
{{- $claims := include "twg.claimNames" $ | fromJsonArray -}}
{{- $claimRe := list -}}
{{- range $claims }}{{ $claimRe = append $claimRe (regexQuoteMeta .) }}{{ end -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  labels:
    {{- include "twg.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # From kube-state-metrics and the kubelet: nothing in the pod serves
  # metrics, so nothing new has to pass the kill switch.
  groups:
    - name: {{ $name }}
      rules:
        # The sidecar is ready only while the kill switch is intact, wg0 is up
        # and wg-quick's policy routing is in place. Not ready: the kill
        # switch holds and Transmission's traffic stops. (A tunnel whose
        # server stopped answering fails the liveness probe instead, after
        # wireguard.handshakeMaxAgeSeconds: the Restarting alert.)
        - alert: TransmissionWireguardTunnelDown
          expr: max by (namespace, pod) (kube_pod_init_container_status_ready{namespace={{ $ns | quote }}, container="wireguard"} {{ $owned }}) == 0
          for: {{ .tunnelDownFor }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "The WireGuard tunnel of {{ "{{" }} $labels.pod {{ "}}" }} has been down for {{ .tunnelDownFor }}"
            description: "Transmission's traffic is blocked, not leaking: the kill switch holds while the tunnel is down. Check the wireguard container's log (handshakes, endpoint) and the VPN provider."
        - alert: TransmissionWireguardUnavailable
          expr: kube_deployment_status_replicas_available{namespace={{ $ns | quote }}, deployment={{ $name | quote }}} < 1
          for: {{ .unavailableFor }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "{{ $name }} has had no available pod for {{ .unavailableFor }}"
            description: "The pod is missing or not ready. Its events and the wireguard container's log say why (a refused setting, an image pull, the tunnel)."
        - alert: TransmissionWireguardRestarting
          expr: |
            sum by (namespace, pod) (
              (
                increase(kube_pod_container_status_restarts_total{namespace={{ $ns | quote }}}[30m])
                or increase(kube_pod_init_container_status_restarts_total{namespace={{ $ns | quote }}}[30m])
              ) {{ $owned }}
            ) > {{ .restartsPer30m }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "Containers of {{ "{{" }} $labels.pod {{ "}}" }} restarted more than {{ .restartsPer30m }} times in 30 minutes"
            description: "A failing liveness probe restarts Transmission when it lost its peer port, and the sidecar when the VPN server has not answered for wireguard.handshakeMaxAgeSeconds. See their logs."
        {{- if $claims }}
        - alert: TransmissionWireguardVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace={{ $ns | quote }}, persistentvolumeclaim=~{{ printf "^(%s)$" (join "|" $claimRe) | quote }}}
              / kubelet_volume_stats_capacity_bytes < {{ .volumeFreeRatio }}
          for: 15m
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} has less than {{ mulf .volumeFreeRatio 100 }}% free"
            description: "Transmission stops writing when the volume is full."
        {{- end }}
        {{- with .extraRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
