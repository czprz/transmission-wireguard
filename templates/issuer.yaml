{{- if .Values.issuer.enabled -}}
apiVersion: cert-manager.io/v1
kind: {{ default "Issuer" .Values.issuer.kind }}
metadata:
  name: {{ include "twg.issuerName" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.issuer.server | quote }}
    email: {{ required "issuer.email is required when issuer.enabled=true" .Values.issuer.email | quote }}
    privateKeySecretRef:
      {{- /* Named like the issuer: a ClusterIssuer's name has the namespace in it, so two never share an ACME account key. */}}
      name: {{ default (include "twg.issuerName" .) .Values.issuer.privateKeySecretName }}
    solvers:
      - http01:
          {{- if and .Values.httpRoute.enabled (not .Values.ingress.enabled) }}
          gatewayHTTPRoute:
            parentRefs:
              {{- /* The challenge arrives on port 80, whichever listener the web UI uses. */}}
              {{- range .Values.httpRoute.parentRefs }}
              - {{ toYaml (omit . "sectionName" "port") | indent 16 | trim }}
              {{- end }}
          {{- else if .Values.ingress.className }}
          ingress:
            class: {{ .Values.ingress.className | quote }}
          {{- else }}
          ingress: {}
          {{- end }}
{{- end }}