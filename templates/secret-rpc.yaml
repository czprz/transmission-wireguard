{{- with .Values.transmission.rpcAuth -}}
{{- if and (not .existingSecret) .username .password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "twg.rpcSecretName" $ }}
  labels:
    {{- include "twg.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .usernameKey }}: {{ .username | quote }}
  {{ .passwordKey }}: {{ .password | quote }}
{{- end }}
{{- end }}
