{{- $a := .Values.transmission.rpcAuth -}}
{{- $legacy := include "twg.legacyRpcAuth" . -}}
{{- if and (not $a.existingSecret) (or (and $a.username $a.password) $legacy) -}}
{{- $s := .Values.transmission.settings -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "twg.rpcSecretName" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $a.usernameKey }}: {{ ternary (index $s "rpc-username") $a.username (not (empty $legacy)) | quote }}
  {{ $a.passwordKey }}: {{ ternary (index $s "rpc-password") $a.password (not (empty $legacy)) | quote }}
{{- end }}
