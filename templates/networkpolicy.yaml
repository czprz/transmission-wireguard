{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twg.fullname" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "twg.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Defence in depth outside the pod: even if the in-pod kill switch were
  # flushed, the CNI only lets the pod talk to the VPN servers.
  egress:
    {{- range include "twg.vpnEndpoints" . | fromJsonArray }}
    - to:
        - ipBlock:
            cidr: {{ .ip }}/{{ if contains ":" .ip }}128{{ else }}32{{ end }}
      ports:
        - protocol: UDP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.webPort }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
