{{- if and .Values.persistence.enabled (ne .Values.persistence.type "hostPath") (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "twg.fullname" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  # Downloads outlive `helm uninstall`; delete the PVC yourself.
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .Values.persistence.accessModes) | nindent 4 }}
  resources:
    requests:
      storage: {{ required "persistence.size must be set when using PVC" .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- with .Values.persistence.downloads }}
{{- if and .enabled (not .existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "twg.fullname" $ }}-downloads
  labels:
    {{- include "twg.labels" $ | nindent 4 }}
  {{- if $.Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .accessModes) | nindent 4 }}
  resources:
    requests:
      storage: {{ required "persistence.downloads.size must be set" .size | quote }}
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
