{{- include "twg.validate" . -}}
{{- $minimal := eq (include "twg.transmissionFlavor" .) "minimal" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twg.fullname" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One WireGuard key: never run the old and the new pod side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "twg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- /* Istio ambient would redirect the pod's traffic with its own rules in the namespace. */ -}}
        {{- $labels := merge (include "twg.selectorLabels" . | fromYaml) (deepCopy .Values.podLabels) (dict "istio.io/dataplane-mode" "none") }}
        {{- toYaml $labels | nindent 8 }}
      annotations:
        {{- /* A mesh proxy cannot reach its control plane through the kill switch, so the pod would never be ready. */ -}}
        {{- $annotations := merge (deepCopy .Values.podAnnotations) (dict "sidecar.istio.io/inject" "false" "linkerd.io/inject" "disabled") }}
        {{- toYaml (omit $annotations "checksum/scripts" "checksum/settings" "checksum/wg" "checksum/rpc") | nindent 8 }}
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | sha256sum }}
        # Secrets are only read at start; roll the pod when they change.
        # (With existingSecret, restart the pod yourself after editing it.)
        checksum/wg: {{ include (print $.Template.BasePath "/secret-wg.yaml") . | sha256sum }}
        {{- /* The RPC Secret's checksum alone would let anyone who can read
        pods test password guesses offline. Hashed with the WireGuard Secret
        (its private key), it can't be; without an inline wg0Conf there is
        no such secret here, so restart the pod after changing rpcAuth. */}}
        {{- if and .Values.wireguard.wg0Conf (include "twg.rpcSecretName" .) (not .Values.transmission.rpcAuth.existingSecret) }}
        checksum/rpc: {{ print (include (print $.Template.BasePath "/secret-wg.yaml") .) (include (print $.Template.BasePath "/secret-rpc.yaml") .) | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      # Nothing in the pod talks to the API server.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "twg.podSecurityContext" . }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- toYaml .Values.wireguard.dns.nameservers | nindent 10 }}
      initContainers:
        # Only the Address lines of wg0.conf, for the next init container:
        # that one runs the Transmission image (linuxserver's, by default),
        # which so never sees the private key.
        - name: tunnel-address
          image: "{{ include "twg.wireguardImage" . }}"
          imagePullPolicy: {{ .Values.images.wireguard.pullPolicy }}
          # grep exits 1 when nothing matches: settings-init.sh says what is missing.
          command: ["/bin/sh", "-c", "umask 022; grep -iE '^[[:space:]]*Address[[:space:]]*=' /twg/wg/wg0.conf >/twg/run/wg-address || [ $? -eq 1 ]"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: wgconf
              mountPath: /twg/wg
              readOnly: true
            - name: settings-run
              mountPath: /twg/run
          resources:
            {{- toYaml .Values.transmission.initResources | nindent 12 }}

        - name: transmission-settings
          image: "{{ include "twg.transmissionImageRef" . }}"
          imagePullPolicy: {{ .Values.images.transmission.pullPolicy }}
          command: ["/bin/sh", "/twg/scripts/settings-init.sh"]
          securityContext:
            {{- if $minimal }}
            # The minimal image's user is PUID; this one chowns as root.
            runAsUser: 0
            {{- end }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PUID
              value: {{ .Values.transmission.env.PUID | default "1000" | quote }}
            - name: PGID
              value: {{ .Values.transmission.env.PGID | default "1000" | quote }}
            - name: TWG_BIND_TO_TUNNEL
              value: {{ .Values.transmission.bindToTunnel | quote }}
            - name: TWG_WG_CONF
              value: /twg/run/wg-address
            {{- if $minimal }}
            # No root init in the minimal image: hand the volumes to PUID/PGID.
            - name: TWG_OWN_DIRS
              value: {{ printf "/config %s" (include "twg.dataPath" .) | quote }}
            {{- end }}
            {{- with include "twg.rpcSecretName" . }}
            - name: RPC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.transmission.rpcAuth.usernameKey }}
            - name: RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.transmission.rpcAuth.passwordKey }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /twg/scripts
            - name: transmission-settings
              mountPath: /twg/settings
            - name: settings-run
              mountPath: /twg/run
            {{- if $minimal }}
            {{- include "twg.storageMounts" . | nindent 12 }}
            {{- with include "twg.dataMount" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.transmission.initResources | nindent 12 }}

        {{- if and .Values.wireguard.unprivileged.enabled (eq (include "twg.sysctlsFrom" .) "initContainer") }}
        # The sysctls an unprivileged sidecar can't write: set once in the
        # pod's network namespace, where they stay, by a privileged
        # container that exits right away, so the kubelet needn't allow them.
        - name: sysctls
          image: "{{ include "twg.wireguardImage" . }}"
          imagePullPolicy: {{ .Values.images.wireguard.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo 1 >/proc/sys/net/ipv4/conf/all/src_valid_mark
              {{- if .Values.wireguard.unprivileged.blockRouterAdvertisements }}
              for f in accept_ra_pinfo accept_ra_rt_info_max_plen; do
                [ ! -e /proc/sys/net/ipv6/conf/eth0/$f ] || echo 0 >/proc/sys/net/ipv6/conf/eth0/$f
              done
              {{- end }}
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.transmission.initResources | nindent 12 }}
        {{- end }}

        # Native sidecar (restartPolicy: Always): Transmission is not started
        # until the startupProbe confirms the kill switch and tunnel are up.
        - name: wireguard
          image: "{{ include "twg.wireguardImage" . }}"
          imagePullPolicy: {{ .Values.images.wireguard.pullPolicy }}
          restartPolicy: Always
          # Install the kill switch before the image's /init starts wg-quick.
          command: ["/bin/bash", "-c", "/twg/scripts/firewall.sh apply && exec /init"]
          securityContext:
            {{- include "twg.wireguardSecurityContext" . | nindent 12 }}
          env:
            {{- range $k, $v := .Values.wireguard.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Every TWG_ variable is set here (wireguard.env may not), so
            # none can be overridden.
            - name: TWG_WG_IFACE
              value: wg0
            - name: TWG_WG_CONF
              value: /config/wg_confs/wg0.conf
            - name: TWG_LOCAL_MARK
              value: "0x10000000"
            - name: TWG_SAVED_ROUTE_TABLE
              value: "1000"
            - name: TWG_WEB_PORT
              value: {{ .Values.service.webPort | quote }}
            - name: TWG_PEER_PORT
              value: {{ include "twg.peerPort" . | quote }}
            - name: TWG_WEB_ALLOWED_CIDRS
              value: {{ join " " .Values.firewall.webAllowedCIDRs | quote }}
            - name: TWG_WG_FWMARK
              value: {{ include "twg.markValue" .Values.firewall.wgFwmark | quote }}
            - name: TWG_ALLOW_CONF_HOOKS
              value: {{ .Values.firewall.allowConfHooks | quote }}
            - name: TWG_HANDSHAKE_MAX_AGE
              value: {{ .Values.wireguard.handshakeMaxAgeSeconds | int64 | toString | quote }}
            {{- with include "twg.failoverPeers" . }}
            - name: TWG_FAILOVER_PEERS
              value: {{ . | quote }}
            - name: TWG_FAILOVER_AFTER
              value: {{ $.Values.wireguard.failover.afterSeconds | int64 | toString | quote }}
            {{- end }}
            - name: TWG_NATPMP_GATEWAY
              value: {{ .Values.wireguard.portForwarding.natpmpGateway | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /twg/scripts
            - name: wgconf
              mountPath: /config/wg_confs
              readOnly: true
            # The addresses Transmission was bound to, so a changed Address is refused.
            - name: settings-run
              mountPath: /twg/run
              readOnly: true
            {{- if .Values.wireguard.portForwarding.natpmpGateway }}
            # The forwarded port, for Transmission's liveness probe.
            - name: forward
              mountPath: /twg/forward
            {{- with include "twg.rpcSecretName" . }}
            # To set the forwarded port as Transmission's peer port.
            - name: rpc-auth
              mountPath: /twg/rpc
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountTun }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
            {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountLibModules }}
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            {{- end }}
          startupProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "tunnel"]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "tunnel"]
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          # Restarts re-apply the kill switch, so altered rules heal. (Root in
          # the sidecar can still change routing, tc or nftables beyond what
          # check sees. Marked packets only pass as UDP to the VPN endpoints or
          # as replies from the web port to webAllowedCIDRs.)
          livenessProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "live"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            # Renewing a NAT-PMP mapping and setting the port over RPC can
            # take up to ~17 s; a slow gateway must not restart the tunnel.
            timeoutSeconds: {{ ternary 20 5 (not (empty .Values.wireguard.portForwarding.natpmpGateway)) }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.wireguard.resources | nindent 12 }}

      containers:
        - name: transmission
          image: "{{ include "twg.transmissionImageRef" . }}"
          imagePullPolicy: {{ .Values.images.transmission.pullPolicy }}
          securityContext:
            {{- include "twg.transmissionSecurityContext" . | nindent 12 }}
          env:
            {{- range $k, $v := .Values.transmission.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.transmission.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # The image stops Transmission through its RPC (transmission-remote
            # --exit) with these credentials, then waits for it. Without them
            # the call fails and the pod is killed at the end of its grace
            # period, before Transmission saves its state.
            {{- /* The minimal image stops on SIGTERM itself. */}}
            {{- $rpcSecret := include "twg.rpcSecretName" . }}
            {{- if not $minimal }}
            {{- if $rpcSecret }}
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: {{ $rpcSecret }}
                  key: {{ .Values.transmission.rpcAuth.usernameKey }}
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $rpcSecret }}
                  key: {{ .Values.transmission.rpcAuth.passwordKey }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.webPort }}
              protocol: TCP
            - containerPort: {{ include "twg.peerPort" . }}
              protocol: TCP
            - containerPort: {{ include "twg.peerPort" . }}
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.webPort }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          # Transmission binds its peer port once. If it started while the
          # tunnel was down, restart it once the tunnel address is back.
          livenessProbe:
            exec:
              command: ["/bin/sh", "/twg/scripts/transmission-live.sh"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.transmission.resources | nindent 12 }}
          volumeMounts:
            {{- include "twg.storageMounts" . | nindent 12 }}
            {{- if $minimal }}
            # The root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: settings-run
              mountPath: /config/settings.json
              subPath: settings.json
              readOnly: true
            - name: scripts
              mountPath: /twg/scripts
              readOnly: true
            # tunnel.env, for the liveness probe.
            - name: settings-run
              mountPath: /twg/run
              readOnly: true
            {{- if .Values.wireguard.portForwarding.natpmpGateway }}
            - name: forward
              mountPath: /twg/forward
              readOnly: true
            {{- end }}
            {{- with .Values.transmission.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with include "twg.dataMount" . }}
            {{- . | nindent 12 }}
            {{- end }}

      volumes:
        - name: wgconf
          secret:
            secretName: {{ include "twg.wgSecretName" . }}
            defaultMode: 0400
            # The image brings up every *.conf it finds; only wg0 is validated.
            items:
              - key: wg0.conf
                path: wg0.conf
        - name: scripts
          configMap:
            name: {{ include "twg.fullname" . }}-scripts
            defaultMode: 0555
        - name: settings-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if $minimal }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if include "twg.dataEmptyDir" . }}
        - name: transmission-data
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.wireguard.portForwarding.natpmpGateway }}
        - name: forward
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- with include "twg.rpcSecretName" . }}
        - name: rpc-auth
          secret:
            secretName: {{ . }}
            defaultMode: 0400
            items:
              - key: {{ $.Values.transmission.rpcAuth.usernameKey }}
                path: username
              - key: {{ $.Values.transmission.rpcAuth.passwordKey }}
                path: password
        {{- end }}
        {{- end }}

        {{- if .Values.persistence.enabled }}
        - name: transmission-storage
          {{- if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path | quote }}
            type: {{ .Values.persistence.hostPath.type | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default (include "twg.fullname" .) .Values.persistence.existingClaim }}
          {{- end }}
        {{- else }}
        - name: transmission-config
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.downloads.enabled }}
        - name: transmission-downloads
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.downloads.existingClaim | default (printf "%s-downloads" (include "twg.fullname" .)) }}
        {{- end }}

        - name: transmission-settings
          configMap:
            name: {{ include "twg.fullname" . }}-transmission-settings
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountTun }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountLibModules }}
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        {{- end }}

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
