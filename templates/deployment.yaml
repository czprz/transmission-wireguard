{{- include "twg.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twg.fullname" . }}
  labels:
    {{- include "twg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "twg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twg.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.wireguard.dns.override }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- toYaml .Values.wireguard.dns.nameservers | nindent 10 }}
      {{- end }}
      initContainers:
        - name: transmission-settings
          image: "{{ include "twg.transmissionImage" . }}"
          imagePullPolicy: {{ .Values.images.transmission.pullPolicy }}
          command: ["/bin/sh", "/twg/scripts/settings-init.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          env:
            - name: PUID
              value: {{ .Values.transmission.env.PUID | default "1000" | quote }}
            - name: PGID
              value: {{ .Values.transmission.env.PGID | default "1000" | quote }}
            - name: TWG_BIND_TO_TUNNEL
              value: {{ .Values.transmission.bindToTunnel | quote }}
            {{- with include "twg.rpcSecretName" . }}
            - name: RPC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.transmission.rpcAuth.usernameKey }}
            - name: RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.transmission.rpcAuth.passwordKey }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /twg/scripts
            - name: transmission-settings
              mountPath: /twg/settings
            - name: wgconf
              mountPath: /twg/wg
              readOnly: true
            - name: settings-run
              mountPath: /twg/run

        # Native sidecar (restartPolicy: Always): Transmission is not started
        # until the startupProbe confirms the kill switch and tunnel are up.
        - name: wireguard
          image: "{{ include "twg.wireguardImage" . }}"
          imagePullPolicy: {{ .Values.images.wireguard.pullPolicy }}
          restartPolicy: Always
          # Install the kill switch before s6 starts wg-quick.
          command: ["/bin/bash", "-c", "/twg/scripts/firewall.sh apply && exec /init"]
          securityContext:
            {{- toYaml .Values.wireguard.securityContext | nindent 12 }}
          env:
            {{- range $k, $v := .Values.wireguard.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: TWG_WEB_PORT
              value: {{ .Values.service.webPort | quote }}
            - name: TWG_PEER_PORT
              value: {{ include "twg.peerPort" . | quote }}
            - name: TWG_WEB_ALLOWED_CIDRS
              value: {{ join " " .Values.firewall.webAllowedCIDRs | quote }}
            - name: TWG_WG_FWMARK
              value: {{ .Values.firewall.wgFwmark | quote }}
            - name: TWG_ALLOW_CONF_FIREWALL_HOOKS
              value: {{ .Values.firewall.allowConfFirewallHooks | quote }}
            - name: TWG_HANDSHAKE_MAX_AGE
              value: {{ .Values.wireguard.handshakeMaxAgeSeconds | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /twg/scripts
            - name: wgconf
              mountPath: /config/wg_confs
              readOnly: true
            {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountTun }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
            {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountLibModules }}
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            {{- end }}
          startupProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "tunnel"]
            periodSeconds: 2
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: 90
          readinessProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "tunnel"]
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          # Restarts re-apply the kill switch, so a tampered firewall heals.
          livenessProbe:
            exec:
              command: ["/twg/scripts/firewall.sh", "live"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.wireguard.resources | nindent 12 }}

      containers:
        - name: transmission
          image: "{{ include "twg.transmissionImage" . }}"
          imagePullPolicy: {{ .Values.images.transmission.pullPolicy }}
          securityContext:
            {{- toYaml .Values.transmission.securityContext | nindent 12 }}
          env:
            {{- range $k, $v := .Values.transmission.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.webPort }}
              protocol: TCP
            - containerPort: {{ include "twg.peerPort" . }}
              protocol: TCP
            - containerPort: {{ include "twg.peerPort" . }}
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.webPort }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          # The pod shares one network namespace, so wg0 is visible here.
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /sys/class/net/wg0"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.transmission.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: transmission-storage
              mountPath: /config
              subPath: config
            {{- else }}
            - name: transmission-config
              mountPath: /config
            {{- end }}
            - name: settings-run
              mountPath: /config/settings.json
              subPath: settings.json
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: transmission-storage
              {{- if and .Values.persistence.mounts .Values.persistence.mounts.data }}
              mountPath: {{ default "/data" .Values.persistence.mounts.data.mountPath }}
              {{- if .Values.persistence.mounts.data.subPath }}
              subPath: {{ .Values.persistence.mounts.data.subPath }}
              {{- end }}
              {{- else }}
              mountPath: /data
              {{- end }}
            {{- end }}

      volumes:
        - name: wgconf
          secret:
            secretName: {{ include "twg.wgSecretName" . }}
            defaultMode: 0400
        - name: scripts
          configMap:
            name: {{ include "twg.fullname" . }}-scripts
            defaultMode: 0555
        - name: settings-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        {{- if .Values.persistence.enabled }}
        - name: transmission-storage
          {{- if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path | quote }}
            type: {{ .Values.persistence.hostPath.type | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default (include "twg.fullname" .) .Values.persistence.existingClaim }}
          {{- end }}
        {{- else }}
        - name: transmission-config
          emptyDir: {}
        {{- end }}

        - name: transmission-settings
          configMap:
            name: {{ include "twg.fullname" . }}-transmission-settings

        {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountTun }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if and .Values.wireguard.kernelMode.enabled .Values.wireguard.kernelMode.mountLibModules }}
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        {{- end }}

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
